<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardHup — Vertical Ad (1080×1920)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0a1428;
    --navy-deep: #060c18;
    --accent: #2f6dfb;
    --accent-glow: #6f9bff;
    --white: #ffffff;
    --muted: #8ba0c7;
    --scene-duration: 2900ms;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background:var(--navy-deep);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage-wrapper{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage{
    position:relative;
    width:1080px;
    height:1920px;
    background:var(--navy);
    overflow:hidden;
    transform-origin:center center;
    flex-shrink:0;
    isolation:isolate;
  }

  /* ---------- ambient background glow ---------- */
  .bg-glow{
    position:absolute;
    border-radius:50%;
    filter:blur(140px);
    z-index:0;
    pointer-events:none;
  }
  .bg-glow--1{
    width:900px; height:900px;
    left:-250px; top:-150px;
    background:radial-gradient(circle, rgba(47,109,251,0.55), rgba(47,109,251,0) 70%);
    animation: floatGlow1 16s ease-in-out infinite;
  }
  .bg-glow--2{
    width:800px; height:800px;
    right:-280px; bottom:-200px;
    background:radial-gradient(circle, rgba(111,155,255,0.35), rgba(111,155,255,0) 70%);
    animation: floatGlow2 19s ease-in-out infinite;
  }
  @keyframes floatGlow1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(80px,60px) scale(1.15); }
  }
  @keyframes floatGlow2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-60px,-50px) scale(1.12); }
  }

  /* ---------- scenes ---------- */
  .scene{
    position:absolute;
    inset:0;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 90px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
  }
  .scene.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------- shield logo ---------- */
  .shield-logo{
    display:block;
    filter:drop-shadow(0 0 24px rgba(47,109,251,0.65));
  }
  .shield-logo svg{ display:block; width:100%; height:100%; }

  .wordmark{
    color:var(--white);
    font-weight:800;
    letter-spacing:-0.01em;
  }

  /* ================= SCENE 1 — logo intro ================= */
  .logo-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:36px;
    opacity:0;
    transform:scale(0.7);
    transition:opacity 1.1s cubic-bezier(0.16,1,0.3,1), transform 1.1s cubic-bezier(0.16,1,0.3,1);
  }
  .scene-1.active .logo-block{
    opacity:1;
    transform:scale(1);
  }
  .logo-glow{
    position:absolute;
    width:560px; height:560px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(47,109,251,0.45), rgba(47,109,251,0) 72%);
    opacity:0;
    transform:scale(0.6);
    transition:opacity 1.3s ease, transform 1.3s ease;
  }
  .scene-1.active .logo-glow{
    opacity:1;
    transform:scale(1);
  }
  .scene-1 .shield-logo{ width:220px; height:220px; }
  .scene-1 .wordmark{ font-size:92px; }

  .eyebrow{
    margin-top:44px;
    font-size:34px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:0.01em;
    opacity:0;
    transform:translateY(18px);
    transition:opacity 0.9s cubic-bezier(0.16,1,0.3,1) 0.55s, transform 0.9s cubic-bezier(0.16,1,0.3,1) 0.55s;
  }
  .scene-1.active .eyebrow{
    opacity:1;
    transform:translateY(0);
  }

  /* ================= SCENE 2 — stat cards ================= */
  .stats-row{
    display:flex;
    gap:28px;
    width:100%;
  }
  .stat-card{
    flex:1;
    text-align:center;
    background:rgba(47,109,251,0.08);
    border:1px solid rgba(111,155,255,0.30);
    border-radius:28px;
    padding:48px 20px;
    opacity:0;
    transform:translateY(50px);
    transition:opacity 0.85s cubic-bezier(0.16,1,0.3,1), transform 0.85s cubic-bezier(0.16,1,0.3,1);
  }
  .scene-2.active .stat-card:nth-child(1){ transition-delay:0s; }
  .scene-2.active .stat-card:nth-child(2){ transition-delay:0.18s; }
  .scene-2.active .stat-card:nth-child(3){ transition-delay:0.36s; }
  .scene-2.active .stat-card{
    opacity:1;
    transform:translateY(0);
  }
  .stat-number{
    font-size:76px;
    font-weight:800;
    color:var(--accent-glow);
    text-shadow:0 0 28px rgba(111,155,255,0.65);
    line-height:1;
    white-space:nowrap;
  }
  .stat-label{
    margin-top:18px;
    font-size:24px;
    font-weight:500;
    color:var(--muted);
    line-height:1.35;
  }

  /* ================= SCENE 3 — match pill + service card ================= */
  .pill{
    display:inline-flex;
    align-items:center;
    padding:20px 44px;
    border-radius:999px;
    background:rgba(47,109,251,0.16);
    border:1px solid var(--accent-glow);
    color:var(--accent-glow);
    font-size:36px;
    font-weight:700;
    box-shadow:0 0 36px rgba(111,155,255,0.4);
    opacity:0;
    transform:scale(0.55);
    transition:opacity 0.7s cubic-bezier(0.34,1.56,0.64,1), transform 0.7s cubic-bezier(0.34,1.56,0.64,1);
  }
  .scene-3.active .pill{
    opacity:1;
    transform:scale(1);
  }
  .service-card{
    margin-top:56px;
    width:100%;
    max-width:900px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:26px;
    padding:38px 46px;
    opacity:0;
    transform:translateY(60px);
    transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1) 0.32s, transform 0.8s cubic-bezier(0.16,1,0.3,1) 0.32s;
  }
  .scene-3.active .service-card{
    opacity:1;
    transform:translateY(0);
  }
  .service-title{
    font-size:42px;
    font-weight:700;
    color:var(--white);
  }
  .service-meta{
    margin-top:10px;
    font-size:26px;
    color:var(--muted);
  }
  .match-badge{
    flex-shrink:0;
    background:var(--accent);
    color:var(--white);
    font-size:26px;
    font-weight:700;
    padding:14px 32px;
    border-radius:999px;
    box-shadow:0 0 22px rgba(47,109,251,0.6);
  }

  /* ================= SCENE 4 — kinetic tagline ================= */
  .tagline{
    text-align:center;
    font-size:100px;
    font-weight:800;
    color:var(--white);
    letter-spacing:-0.01em;
  }
  .tagline .word{
    display:inline-block;
    opacity:0;
    filter:blur(16px);
    transform:translateY(24px);
    transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1), filter 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
  }
  .scene-4.active .tagline .word{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
  }
  .scene-4.active .tagline .word:nth-child(1){ transition-delay:0s; }
  .scene-4.active .tagline .word:nth-child(2){ transition-delay:0.22s; }
  .scene-4.active .tagline .word:nth-child(3){ transition-delay:0.44s; }
  .word--glow{
    color:var(--accent-glow);
    text-shadow:0 0 34px rgba(111,155,255,0.75);
  }

  /* ================= SCENE 5 — CTA ================= */
  .scene-5 .shield-logo{
    width:110px; height:110px;
    opacity:0;
    transform:scale(0.7);
    transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
  }
  .scene-5.active .shield-logo{ opacity:1; transform:scale(1); }
  .scene-5 .wordmark{
    margin-top:24px;
    font-size:50px;
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s, transform 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s;
  }
  .scene-5.active .wordmark{ opacity:1; transform:translateY(0); }

  .cta-buttons{
    margin-top:70px;
    display:flex;
    gap:24px;
  }
  .btn{
    font-family:inherit;
    font-size:32px;
    font-weight:700;
    padding:30px 40px;
    border-radius:18px;
    cursor:pointer;
    opacity:0;
    transform:translateY(40px);
    transition:opacity 0.75s cubic-bezier(0.16,1,0.3,1), transform 0.75s cubic-bezier(0.16,1,0.3,1);
  }
  .scene-5.active .btn:nth-child(1){ transition-delay:0.28s; }
  .scene-5.active .btn:nth-child(2){ transition-delay:0.44s; }
  .scene-5.active .btn{ opacity:1; transform:translateY(0); }
  .btn--solid{
    background:var(--accent);
    border:2px solid var(--accent);
    color:var(--white);
    box-shadow:0 0 30px rgba(47,109,251,0.55);
  }
  .btn--outline{
    background:transparent;
    border:2px solid var(--accent-glow);
    color:var(--white);
  }

  .bio-link{
    margin-top:46px;
    font-size:30px;
    font-weight:500;
    color:var(--muted);
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1) 0.65s, transform 0.8s cubic-bezier(0.16,1,0.3,1) 0.65s;
  }
  .scene-5.active .bio-link{ opacity:1; transform:translateY(0); }

  /* ---------- replay button ---------- */
  .replay-btn{
    position:absolute;
    right:48px;
    bottom:48px;
    z-index:10;
    width:96px;
    height:96px;
    border-radius:50%;
    background:rgba(10,20,40,0.55);
    border:1px solid rgba(111,155,255,0.45);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent-glow);
    cursor:pointer;
    transition:transform 0.2s ease, background 0.2s ease;
  }
  .replay-btn:hover{
    background:rgba(47,109,251,0.25);
    transform:scale(1.06);
  }
  .replay-btn:active{ transform:scale(0.94); }
  .replay-btn svg{ width:44px; height:44px; }

  /* ---------- reduced motion ---------- */
  .stage.reduced-motion .bg-glow{ animation:none; }
  .stage.reduced-motion *{
    transition-duration:0.4s !important;
    transition-delay:0s !important;
  }
  .stage.reduced-motion .logo-block,
  .stage.reduced-motion .stat-card,
  .stage.reduced-motion .pill,
  .stage.reduced-motion .service-card,
  .stage.reduced-motion .tagline .word,
  .stage.reduced-motion .shield-logo,
  .stage.reduced-motion .wordmark,
  .stage.reduced-motion .btn,
  .stage.reduced-motion .bio-link,
  .stage.reduced-motion .eyebrow{
    transform:none !important;
    filter:none !important;
  }

  /* ---------- dev chrome (outside the 1080x1920 frame) ---------- */
  .frame-info{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    font-family:'Inter', system-ui, sans-serif;
    font-size:12px;
    color:#3d5a8a;
    letter-spacing:0.03em;
    z-index:100;
  }
</style>
</head>
<body>

<div class="stage-wrapper">
  <div class="stage" id="stage">
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>

    <!-- SCENE 1 : logo intro -->
    <section class="scene scene-1" data-scene="1">
      <div class="logo-glow"></div>
      <div class="logo-block">
        <div class="shield-logo">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                  fill="#2f6dfb" stroke="#ffffff" stroke-width="1.3"
                  stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="wordmark">GuardHup</span>
      </div>
      <p class="eyebrow">Beveiliging, goed geregeld</p>
    </section>

    <!-- SCENE 2 : stat cards -->
    <section class="scene scene-2" data-scene="2">
      <div class="stats-row">
        <div class="stat-card" data-target="110" data-prefix="" data-suffix="+">
          <div class="stat-number"><span class="num">0</span><span class="suffix"></span></div>
          <div class="stat-label">geverifieerde<br>professionals</div>
        </div>
        <div class="stat-card" data-target="120" data-prefix="" data-suffix="+">
          <div class="stat-number"><span class="num">0</span><span class="suffix"></span></div>
          <div class="stat-label">diensten<br>online</div>
        </div>
        <div class="stat-card" data-target="33" data-prefix="€" data-suffix="+">
          <div class="stat-number"><span class="prefix"></span><span class="num">0</span><span class="suffix"></span></div>
          <div class="stat-label">per uur</div>
        </div>
      </div>
    </section>

    <!-- SCENE 3 : match pill + service card -->
    <section class="scene scene-3" data-scene="3">
      <div class="pill">In 1 match geregeld</div>
      <div class="service-card">
        <div>
          <div class="service-title">Winkeltoezicht</div>
          <div class="service-meta">Amsterdam · 8u</div>
        </div>
        <div class="match-badge">Match</div>
      </div>
    </section>

    <!-- SCENE 4 : kinetic tagline -->
    <section class="scene scene-4" data-scene="4">
      <h2 class="tagline">
        <span class="word">Security</span> <span class="word">done</span> <span class="word word--glow">right.</span>
      </h2>
    </section>

    <!-- SCENE 5 : CTA -->
    <section class="scene scene-5" data-scene="5">
      <div class="shield-logo">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                fill="#2f6dfb" stroke="#ffffff" stroke-width="1.3"
                stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="wordmark">GuardHup</span>
      <div class="cta-buttons">
        <button class="btn btn--solid" type="button">Ben jij werkgever?</button>
        <button class="btn btn--outline" type="button">Ben jij ZZP?</button>
      </div>
      <p class="bio-link">→ link in bio</p>
    </section>

    <button class="replay-btn" id="replayBtn" aria-label="Replay animatie" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/>
        <polyline points="3 3 3 8 8 8"/>
      </svg>
    </button>
  </div>
</div>

<div class="frame-info">GuardHup · 1080×1920 · loop ~15s</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var scenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
  var replayBtn = document.getElementById('replayBtn');
  var SCENE_DURATION = 2900;
  var LOOP_GAP = 500;
  var timers = [];
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var countGeneration = 0;

  if (reduced) stage.classList.add('reduced-motion');

  function fitStage(){
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  function clearTimers(){
    timers.forEach(function(t){ clearTimeout(t); });
    timers = [];
  }

  function resetCounters(){
    document.querySelectorAll('.stat-card').forEach(function(card){
      var numEl = card.querySelector('.num');
      var prefixEl = card.querySelector('.prefix');
      var suffixEl = card.querySelector('.suffix');
      numEl.textContent = '0';
      if (prefixEl) prefixEl.textContent = '';
      if (suffixEl) suffixEl.textContent = '';
    });
  }

  function animateCounters(){
    var myGeneration = ++countGeneration;
    var cards = document.querySelectorAll('.stat-card');
    cards.forEach(function(card, i){
      var target = parseInt(card.dataset.target, 10);
      var prefix = card.dataset.prefix || '';
      var suffix = card.dataset.suffix || '';
      var numEl = card.querySelector('.num');
      var prefixEl = card.querySelector('.prefix');
      var suffixEl = card.querySelector('.suffix');
      var delay = reduced ? 0 : i * 180;
      var duration = reduced ? 0 : 1300;

      setTimeout(function(){
        if (myGeneration !== countGeneration) return;
        if (prefixEl) prefixEl.textContent = prefix;
        if (duration === 0){
          numEl.textContent = target;
          suffixEl.textContent = suffix;
          return;
        }
        var start = null;
        function step(ts){
          if (myGeneration !== countGeneration) return;
          if (start === null) start = ts;
          var progress = Math.min((ts - start) / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          numEl.textContent = Math.round(eased * target);
          if (progress < 1){
            requestAnimationFrame(step);
          } else {
            suffixEl.textContent = suffix;
          }
        }
        requestAnimationFrame(step);
      }, delay);
    });
  }

  function setActive(scene){
    scenes.forEach(function(s){ s.classList.remove('active'); });
    if (scene) scene.classList.add('active');
  }

  function playTimeline(){
    clearTimers();
    countGeneration++;
    setActive(null);
    resetCounters();

    scenes.forEach(function(scene, i){
      var t = setTimeout(function(){
        setActive(scene);
        if (scene.dataset.scene === '2') animateCounters();
      }, i * SCENE_DURATION);
      timers.push(t);
    });

    var loopTimer = setTimeout(function(){
      playTimeline();
    }, scenes.length * SCENE_DURATION + LOOP_GAP);
    timers.push(loopTimer);
  }

  replayBtn.addEventListener('click', function(){
    playTimeline();
  });

  playTimeline();
})();
</script>
</body>
</html>
